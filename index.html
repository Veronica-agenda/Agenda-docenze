      save(x.id, {k:"par", nome:v.nome, cognome:v.cognome, luogoNascita:v.luogoNascita, dataNascita:v.dataNascita||"", cf:(v.cf||"").toUpperCase(), corsoRich:v.corsoRich, prev:v.prev||null, ebf:v.ebf||null, attestato:!!v.attestato});
      close(); toast("Partecipante salvato");
    });
    if (x.id) armDelete(m.querySelector("#x-del"), () => { del(x.id); close(); toast("Partecipante eliminato"); });
  });
}

function ebfModal(c){
  c = c || {titolo:"", codice:"", ini:"", fin:"", ore:"", mod:"online", sede:"", max:"", stato:"aperto"};
  openModal(`<form><h2>${c.id?"Corso EBAFOS":"Nuovo corso EBAFOS"}</h2>
    <div class="fld"><label for="e-t">Titolo / tipologia</label>${corsoField("titolo", c.titolo, "e-t")}</div>
    <div class="row">
      <div class="fld"><label for="e-c">ID corso sul portale</label><input id="e-c" name="codice" value="${esc(c.codice||"")}"></div>
      <div class="fld"><label for="e-o">Ore</label><input id="e-o" type="number" step="0.5" name="ore" value="${esc(c.ore||"")}"></div>
      <div class="fld"><label for="e-m">Max partecipanti</label><input id="e-m" type="number" name="max" value="${esc(c.max||"")}"></div>
    </div>
    <div class="row">
      <div class="fld"><label for="e-i">Inizio</label><input id="e-i" type="date" name="ini" value="${esc(c.ini||"")}"></div>
      <div class="fld"><label for="e-f">Fine</label><input id="e-f" type="date" name="fin" value="${esc(c.fin||"")}"></div>
    </div>
    <div class="lbl" style="margin-bottom:6px">Modalità</div>
    <div class="seg"><input type="radio" name="mod" id="em-on" value="online" ${c.mod!=="presenza"?"checked":""}><label for="em-on">Online</label><input type="radio" name="mod" id="em-pr" value="presenza" ${c.mod==="presenza"?"checked":""}><label for="em-pr">In presenza</label></div>
    <div class="fld"><label for="e-s">Sede</label><input id="e-s" name="sede" value="${esc(c.sede||"")}">${sedeChips("e-s")}</div>
    <div class="lbl" style="margin-bottom:6px">Stato sul portale</div>
    <div class="seg"><input type="radio" name="stato" id="es-a" value="aperto" ${c.stato==="aperto"?"checked":""}><label for="es-a">Aperto</label><input type="radio" name="stato" id="es-c" value="chiuso" ${c.stato!=="aperto"?"checked":""}><label for="es-c">Chiuso</label></div>
    <div class="fld"><label for="e-n">Note</label><textarea id="e-n" name="note">${esc(c.note||"")}</textarea></div>
    <div class="mfoot">${c.id?`<button type="button" class="btn danger" id="e-del">Elimina</button>`:""}<div class="spacer"></div><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`,
  (m, close) => {
    m.querySelector("form").addEventListener("submit", e => {
      e.preventDefault(); const v = fd(e.target);
      if (!v.titolo){ toast("Scegli il corso."); return; }
      save(c.id, {k:"ebf", titolo:v.titolo, codice:v.codice, ore:num(v.ore)||"", max:v.max, ini:v.ini, fin:v.fin||v.ini, mod:v.mod, sede:v.sede, stato:v.stato, note:v.note});
      close(); toast("Corso salvato");
    });
    if (c.id) armDelete(m.querySelector("#e-del"), async () => {
      close();
      await seq(par().filter(p => p.ebf === c.id), p => patch(p.id, {ebf:null}));
      del(c.id); toast("Corso eliminato: gli iscritti tornano da smistare");
    });
  });
}

function settingsModal(){
  const C = cfg();
  openModal(`<form><h2>Tariffe e pagamenti</h2>
    <div class="hint">Valori proposti in automatico per le nuove docenze. Su ogni docenza puoi sempre cambiare la tariffa (es. trasferte fuori Roma).</div>
    ${FATT_AZ.map(k => `<div class="card" style="margin-bottom:10px;border-left:4px solid ${C[k].c}">
      <div style="font-weight:700;margin-bottom:8px">${esc(C[k].full)}</div>
      <div class="row">
        <div class="fld"><label for="s-${k}-t">€/h online</label><input id="s-${k}-t" type="number" step="0.5" name="${k}.tariffa" value="${esc(C[k].tariffa)}"></div>
        <div class="fld"><label for="s-${k}-p">€/h presenza Roma</label><input id="s-${k}-p" type="number" step="0.5" name="${k}.tariffaPres" value="${esc(C[k].tariffaPres)}"></div>
        <div class="fld"><label for="s-${k}-fu">€/h fuori Roma</label><input id="s-${k}-fu" type="number" step="0.5" name="${k}.tariffaFuori" value="${esc(C[k].tariffaFuori ?? C[k].tariffaPres)}"></div>
        <div class="fld"><label for="s-${k}-g">Paga a (giorni)</label><input id="s-${k}-g" type="number" name="${k}.gg" value="${esc(C[k].gg ?? "")}" placeholder="non noto"></div>
      </div>
      ${C[k].docs ? `<div class="row"><div class="fld"><label for="s-${k}-ds">DVR senza sopralluogo €</label><input id="s-${k}-ds" type="number" step="1" name="${k}.docSenza" value="${esc(C[k].docSenza ?? "")}" placeholder="da concordare"></div><div class="fld"><label for="s-${k}-dr">DVR con sopralluogo Roma €</label><input id="s-${k}-dr" type="number" step="1" name="${k}.docRoma" value="${esc(C[k].docRoma ?? "")}" placeholder="da concordare"></div></div>` : ""}
      <div class="fld"><label for="s-${k}-f">Fatturazione</label><select id="s-${k}-f" name="${k}.fatt"><option value="mensile" ${C[k].fatt==="mensile"?"selected":""}>Mensile (fattura unica a fine mese)</option><option value="docenza" ${C[k].fatt==="docenza"?"selected":""}>A ogni attività</option></select></div>
    </div>`).join("")}
    <div class="small muted" style="margin:6px 0">${auth && auth.currentUser ? "Accesso come " + esc(auth.currentUser.email) : ""}</div>
    <div class="mfoot">${auth && auth.currentUser ? `<button type="button" class="btn" id="s-out">Esci</button>` : ""}<div class="spacer"></div><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`,
  (m, close) => {
    const out = m.querySelector("#s-out"); if (out) out.addEventListener("click", () => { close(); signOut(auth); });
    m.querySelector("form").addEventListener("submit", e => {
      e.preventDefault(); const v = fd(e.target); const az = {};
      const nn = x => (x == null || x === "") ? null : num(x);
      FATT_AZ.forEach(k => { az[k] = {tariffa:num(v[k+".tariffa"]), tariffaPres:num(v[k+".tariffaPres"]), tariffaFuori:num(v[k+".tariffaFuori"]), gg: nn(v[k+".gg"]), fatt:v[k+".fatt"]};
        if (k+".docSenza" in v){ az[k].docSenza = nn(v[k+".docSenza"]); az[k].docRoma = nn(v[k+".docRoma"]); } });
      save("settings", {k:"cfg", az}); close(); toast("Impostazioni salvate");
    });
  });
}

/* ---------- copia ---------- */
function copyText(txt){
  const done = () => toast("Copiato: incollalo nel programma di fatturazione");
  const fallback = () => openModal(`<h2>Riepilogo</h2><div class="hint">Seleziona e copia il testo.</div><div class="fld"><textarea style="min-height:240px" readonly>${esc(txt)}</textarea></div><div class="mfoot"><div class="spacer"></div><button class="btn" data-close>Chiudi</button></div>`);
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
}
function riepilogo(az){
  const C = cfg(), a = C[az];
  const ls = voci().filter(l => l.az === az && ym(l.data) === ui.fattMonth).sort(sortLez);
  const rows = ls.map(l => l.k === "doc"
    ? `${fmtD(l.data)} · ${docTipo(l)}${l.cliente?" ("+l.cliente+")":""} · ${SOPR[l.sopr||"no"].toLowerCase()} · ${eur(l.compenso)}${num(l.rimborso)?" + rimborso spese "+eur(l.rimborso):""}`
    : `${fmtD(l.data)} · ${l.titolo||"Docenza"}${l.cliente?" ("+l.cliente+")":""} · ${modLabel(l).toLowerCase()} · ${oreF(l.ore)} × ${eur(l.tariffa)}${num(l.rimborso)?" + rimborso spese "+eur(l.rimborso):""} = ${eur(lezImporto(l))}`);
  return `${a.full} · Riepilogo attività ${meseNome(ui.fattMonth)}\n\n${rows.join("\n")}\n\nTotale: ${oreF(ls.reduce((s,l)=>s+num(l.ore),0))} · ${eur(ls.reduce((s,l)=>s+lezImporto(l),0))}`;
}

/* ---------- eventi ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || (el.tagName === "INPUT")) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case "calprev": ui.calMonth = addMonths(ui.calMonth,-1); render(); break;
    case "calnext": ui.calMonth = addMonths(ui.calMonth, 1); render(); break;
    case "caltoday": ui.calMonth = today().slice(0,7); ui.selDay = today(); render(); break;
    case "selday": ui.selDay = el.dataset.d; if (ym(el.dataset.d) !== ui.calMonth) ui.calMonth = ym(el.dataset.d); render(); break;
    case "filter": { const k = el.dataset.az; ui.filters.has(k) ? ui.filters.delete(k) : ui.filters.add(k); if (!ui.filters.size) AZ_KEYS.forEach(x => ui.filters.add(x)); render(); break; }
    case "newlez": lezModal({data: el.dataset.d || ui.selDay}); break;
    case "editlez": { const l = items.get(id); if (l) lezModal({...l}); break; }
    case "confopz": confermaOpz(id); break;
    case "newdoc": docModal({az: el.dataset.az || "studioeffe"}); break;
    case "editdoc": { const d = items.get(id); if (d) docModal({...d}); break; }
    case "docok": { const d = items.get(id); if (d){ patch(id, {stato:"consegnato", data: d.data && d.data <= today() ? d.data : today()}); toast(num(d.compenso) ? "Documento consegnato: entra nella fattura del mese" : "Documento consegnato: ricordati di indicare il compenso"); } break; }
    case "delopz": del(id); toast("Data liberata"); break;
    case "fprev": ui.fattMonth = addMonths(ui.fattMonth,-1); render(); break;
    case "fnext": ui.fattMonth = addMonths(ui.fattMonth, 1); render(); break;
    case "gomese": ui.fattMonth = el.dataset.m; if (ui.tab === "fatture") render(); break;
    case "newfat": fatModal(el.dataset.az, el.dataset.ids.split(",").filter(Boolean)); break;
    case "editfat": { const f = items.get(id); if (f) fatModal(f.az, f.lez||[], f); break; }
    case "paga": ask("Fattura saldata", [{n:"d", l:"Data del pagamento", t:"date", v:today(), req:true}], "Segna saldata").then(v => { patch(id, {pagata:v.d}); toast("Pagamento registrato"); }); break;
    case "copia": copyText(riepilogo(el.dataset.az)); break;
    case "togglefatt": ui.fattShowAll = !ui.fattShowAll; render(); break;
    case "newprev": prevModal(); break;
    case "editprev": { const p = items.get(id); if (p) prevModal({...p}); break; }
    case "prevconcluso": patch(id, {stato:"concluso"}); toast("Corsi segnati come svolti"); break;
    case "prevfatt": { const p = items.get(id); ask(`Fattura a ${p.cliente}`, [{n:"num", l:"Numero fattura"}, {n:"d", l:"Data emissione", t:"date", v:today(), req:true}], "Registra").then(v => { patch(id, {fattNum:v.num, fattData:v.d}); toast("Fattura registrata"); }); break; }
    case "prevsaldo": ask("Preventivo saldato", [{n:"d", l:"Data del pagamento", t:"date", v:today(), req:true}], "Segna saldato").then(v => { patch(id, {saldato:v.d}); toast("Saldo registrato"); }); break;
    case "prevatt": (async () => { await patch(id, {attestatiEmessi:true}); await seq(par().filter(x => x.prev === id && !x.attestato), x => patch(x.id, {attestato:true})); toast("Attestati segnati come emessi"); })(); break;
    case "addpar": addParModal(id); break;
    case "iscritti": addParModal(null, id); break;
    case "dacliente": pickModal(id); break;
    case "togglepapa": ui.papaShowClosed = !ui.papaShowClosed; render(); break;
    case "newebf": ebfModal(); break;
    case "editebf": { const c = items.get(id); if (c) ebfModal({...c}); break; }
    case "newpar": parModal(); break;
    case "editpar": { const x = items.get(id); if (x) parModal({...x}); break; }
    case "unassign": patch(id, {ebf:null}); toast("Partecipante rimesso tra i da smistare"); break;
    case "chiudiebf": patch(id, {stato:"chiuso"}); toast("Corso chiuso: ora segna gli attestati"); break;
    case "attall": (async () => { await seq(par().filter(p => p.ebf === id && !p.attestato), p => patch(p.id, {attestato:true})); toast("Attestati segnati per tutti"); })(); break;
    case "copiaebf": { const c = items.get(id); const ps = par().filter(p => p.ebf === id); copyText(`${c.titolo}${c.codice?" (ID "+c.codice+")":""}\nCognome; Nome; Luogo di nascita; Data di nascita; Codice fiscale; Azienda\n\n${ps.map(p => { const pr = p.prev && items.get(p.prev); return [p.cognome||"", p.nome||"", p.luogoNascita||"", fmtD(p.dataNascita), p.cf||"", (pr && pr.cliente)||""].join("; "); }).join("\n")}`); break; }
    case "toggleebf": ui.ebfShowClosed = !ui.ebfShowClosed; render(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "assegna" && el.value){ patch(el.dataset.id, {ebf: el.value}); toast("Partecipante assegnato"); }
  if (el.dataset.act === "att"){ patch(el.dataset.id, {attestato: el.checked}); }
});
$("#fab").addEventListener("click", () => lezModal({data: ui.tab === "calendario" ? ui.selDay : today()}));
$("#btn-settings").addEventListener("click", settingsModal);
function route(){
  const h = location.hash.replace("#","");
  ui.tab = TABS.some(t => t.id === h) ? h : "calendario";
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();

/* ---------- correzione una tantum: pausa pranzo sulle docenze già inserite ---------- */
let migDone = false;
function migraPausa(){
  if (migDone) return; migDone = true;
  const s0 = items.get("settings");
  if (s0 && s0.migPausa) return;
  const tocca = lez().filter(l => !l.fat && l.ini && l.fin && l.pausa == null && pausaAuto(diffH(l.ini, l.fin)) && Math.abs(num(l.ore) - diffH(l.ini, l.fin)) < 0.01);
  tocca.forEach(l => patch(l.id, {ore: diffH(l.ini, l.fin) - 1, pausa: true}));
  save("settings", {...(s0 || {}), k:"cfg", migPausa:true});
  if (tocca.length) toast(`Pausa pranzo tolta da ${plural(tocca.length,"docenza già inserita","docenze già inserite")}`);
}

/* ---------- avvio: Firebase ---------- */
let auth = null, fs = null, unsub = null;
const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("INSERISCI");
function showLogin(show){ $("#login").hidden = !show; }
const errIt = e => ({
  "auth/invalid-credential":"Email o password non corretti.", "auth/wrong-password":"Password non corretta.", "auth/user-not-found":"Nessun account con questa email: premi «Crea account».",
  "auth/email-already-in-use":"Esiste già un account con questa email: premi «Accedi».", "auth/weak-password":"La password deve avere almeno 6 caratteri.",
  "auth/invalid-email":"Email non valida.", "auth/network-request-failed":"Serve la connessione per il primo accesso. Riprova quando sei online.",
  "auth/too-many-requests":"Troppi tentativi: riprova tra qualche minuto.", "auth/operation-not-allowed":"Accesso con email non attivato in Firebase (Authentication → Email/Password)."
}[e && e.code] || "Qualcosa non ha funzionato. Riprova.");
if (!configured){ mode = "local"; render(); }
else {
  const app = initializeApp(firebaseConfig);
  try { auth = initializeAuth(app, {persistence:[indexedDBLocalPersistence, browserLocalPersistence]}); } catch(e){ auth = getAuth(app); }
  try { fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e){ fs = getFirestore(app); }
  const lf = $("#f-login"), err = $("#lg-err");
  const creds = () => [lf.elements.email.value.trim(), lf.elements.password.value];
  lf.addEventListener("submit", e => { e.preventDefault(); err.textContent = ""; const [em,pw] = creds(); signInWithEmailAndPassword(auth, em, pw).catch(x => err.textContent = errIt(x)); });
  $("#lg-new").addEventListener("click", () => { err.textContent = ""; const [em,pw] = creds(); if (!em || pw.length < 6){ err.textContent = "Scrivi email e una password di almeno 6 caratteri."; return; } createUserWithEmailAndPassword(auth, em, pw).catch(x => err.textContent = errIt(x)); });
  $("#lg-reset").addEventListener("click", () => { const [em] = creds(); if (!em){ err.textContent = "Scrivi prima la tua email."; return; } sendPasswordResetEmail(auth, em).then(() => err.textContent = "Ti ho inviato un'email per reimpostare la password.", x => err.textContent = errIt(x)); });
  onAuthStateChanged(auth, u => {
    if (unsub){ unsub(); unsub = null; }
    if (!u){ items = new Map(); col = null; mode = "loading"; render(); showLogin(true); return; }
    showLogin(false);
    col = collection(fs, "users", u.uid, "items");
    unsub = onSnapshot(col, {includeMetadataChanges:true}, snap => {
      mode = "cloud"; pendingWrites = snap.metadata.hasPendingWrites;
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, {id:d.id, ...d.data()}));
      items = m; render();
      if (!snap.metadata.fromCache) migraPausa();
    }, e => { toast(e && e.code === "permission-denied" ? "Accesso ai dati negato: controlla le regole di Firestore." : "Non riesco a leggere i dati. Riprova più tardi."); });
  });
}
window.addEventListener("online", render);
window.addEventListener("offline", render);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
