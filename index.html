<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Docenze</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docenze">
<meta name="theme-color" content="#22324a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app a schede (Calendario · Fatture · Papà · EBAFOS); nav in alto su desktop, in basso su telefono */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#1a2230; --muted:#5f6b7b; --line:#dfe3ea;
  --accent:#22324a; --accent-ink:#ffffff;
  --c-scilla:#8b4cc6; --c-bioinvent:#2e6bd3; --c-cmb:#dd7417; --c-studioeffe:#c93a6a; --c-papa:#2b9a5a;
  --ok:#23804a; --warn:#b77800; --bad:#c0392b; --info:#2e6bd3;
  --ok-bg:#e5f4eb; --warn-bg:#fdf1d8; --bad-bg:#fbe5e2; --info-bg:#e6eefb;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --surface-2:#202733; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2d3644;
    --accent:#c9d6ea; --accent-ink:#12161d;
    --c-scilla:#b07ee6; --c-bioinvent:#6198f0; --c-cmb:#f0954a; --c-studioeffe:#ec6f98; --c-papa:#4cc07e;
    --ok:#55c483; --warn:#e6ac3a; --bad:#ef6b5c; --info:#6c9ff0;
    --ok-bg:#16301f; --warn-bg:#332811; --bad-bg:#3a1c19; --info-bg:#172540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --surface-2:#202733; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2d3644;
  --accent:#c9d6ea; --accent-ink:#12161d;
  --c-scilla:#b07ee6; --c-bioinvent:#6198f0; --c-cmb:#f0954a; --c-studioeffe:#ec6f98; --c-papa:#4cc07e;
  --ok:#55c483; --warn:#e6ac3a; --bad:#ef6b5c; --info:#6c9ff0;
  --ok-bg:#16301f; --warn-bg:#332811; --bad-bg:#3a1c19; --info-bg:#172540;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--c-bioinvent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  display:flex;align-items:center;gap:16px}
header.top h1{font-size:20px;white-space:nowrap}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
nav.tabs{display:flex;gap:4px}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;position:relative}
nav.tabs a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
nav.tabs svg{width:18px;height:18px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

main{max-width:1180px;margin:0 auto;padding:16px max(16px, env(safe-area-inset-left)) 120px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);font-size:14px;margin-bottom:12px}

@media (max-width:760px){
  header.top{gap:10px}
  header.top h1{font-size:18px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
  nav.tabs a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;text-align:center}
  nav.tabs a .badge{position:absolute;top:2px;right:calc(50% - 22px)}
  .sync{display:none}
}

/* elementi comuni */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section{display:grid;gap:12px;margin-bottom:22px}
.section-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

/* avvisi */
.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;border-left:4px solid;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;text-decoration:none;color:inherit}
.alert.warn{border-left-color:var(--warn)} .alert.bad{border-left-color:var(--bad)} .alert.info{border-left-color:var(--info)}
.alert .t{font-weight:600} .alert .s{color:var(--muted);font-size:13px}
.alert .go{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}

/* calendario */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.calbar h2{font-size:22px;min-width:170px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipf{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;font-weight:600;cursor:pointer}
.chipf[aria-pressed="false"]{opacity:.45}
.chipf .h{color:var(--muted);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px;text-transform:uppercase;letter-spacing:.04em}
.cal .day{background:var(--surface);min-height:96px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;font:inherit;color:inherit}
.cal .day.out{background:var(--surface-2);color:var(--muted)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day .n{font-size:13px;font-weight:600;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.cal .day.today .n{background:var(--accent);color:var(--accent-ink)}
.ev{display:block;font-size:12px;line-height:1.25;padding:2px 5px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.opz{background:transparent;border:1px dashed var(--c);border-left:3px dashed var(--c);color:var(--muted)}
.lrow.opz{border-style:dashed;background:transparent}
.lrow.opz .bar{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.opzrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.opzrow .d{flex:1;min-width:120px}
.ev.doc{font-style:italic;background:color-mix(in srgb, var(--c) 7%, transparent);border-left-style:double;border-left-width:4px}
.more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:640px){
  .ev.opz{background:transparent;border:1px dashed var(--c);height:6px}
  .cal .day{min-height:58px;padding:3px}
  .cal .wd{padding:5px 3px;text-align:center;font-size:11px}
  .ev{font-size:0;height:5px;padding:0;border-left:0;background:var(--c);border-radius:3px}
  .more{font-size:10px}
}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.agenda{display:grid;gap:8px}
.agenda h3{font-size:16px}
.lrow{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.lrow:hover{background:var(--surface-2)}
.lrow .bar{width:4px;border-radius:2px;background:var(--c);flex:none}
.lrow .b{flex:1;min-width:0;display:grid;gap:2px}
.lrow .tt{font-weight:600}
.lrow .meta{font-size:13px;color:var(--muted)}
.lrow .r{text-align:right;font-size:13px;white-space:nowrap}
.fab{position:fixed;right:max(18px, env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:25;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
@media (min-width:761px){.fab{bottom:28px}}

/* tessere ore */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c, var(--accent));border-radius:var(--r);padding:10px 12px}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-display);font-size:24px;font-weight:700}
.tile .s{font-size:13px;color:var(--muted)}

/* tabelle */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0}
.azcard{border-left:4px solid var(--c)}
.azcard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.azcard-h h3{font-size:17px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* passi preventivo */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.step{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.step.now{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
.plist{display:grid;gap:4px;margin-top:8px}
.prow{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow .nm{flex:1;min-width:140px}
.prow select{max-width:100%}

/* modale */
.backdrop{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.backdrop{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{border-radius:16px}}
.modal h2{font-size:20px;margin-bottom:12px}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.fld textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;background:var(--surface)}
.seg input:checked + label{border-color:var(--c, var(--accent));background:color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface));box-shadow:inset 0 0 0 1px var(--c, var(--accent))}
.seg input:focus-visible + label{outline:2px solid var(--c-bioinvent);outline-offset:2px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.mfoot .spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login[hidden]{display:none}
.login .card{width:100%;max-width:380px;padding:22px}
.login h2{font-size:24px;margin-bottom:4px}
.login .err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px}
.corso-f select,.corso-f input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.corso-f input{margin-top:6px}
.row > *{min-width:0}
.fld input,.fld select{min-width:0;max-width:100%}
.corso-f input[hidden]{display:none}
.sede-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:60}
@media (prefers-reduced-motion: no-preference){ .modal{animation:up .18s ease-out} @keyframes up{from{transform:translateY(16px);opacity:.6}} }
</style>
</head>
<body>
<header class="top">
  <h1>Agenda Docenze</h1>
  <span class="sync" id="sync">Caricamento…</span>
  <div class="spacer"></div>
  <nav class="tabs" id="nav"></nav>
  <button class="iconbtn" id="btn-settings" title="Tariffe e impostazioni" aria-label="Tariffe e impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Aggiungi docenza" title="Aggiungi docenza">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div id="modal-root"></div>
<div class="login" id="login" hidden>
  <form class="card" id="f-login">
    <h2>Agenda Docenze</h2>
    <p class="muted small" style="margin:0 0 14px">Accedi per vedere e sincronizzare le tue docenze su tutti i dispositivi.</p>
    <div class="fld"><label for="lg-e">Email</label><input id="lg-e" name="email" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="lg-p">Password</label><input id="lg-p" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
    <div class="err" id="lg-err" role="alert"></div>
    <div class="actions"><button class="btn primary" id="lg-in">Accedi</button><button type="button" class="btn" id="lg-new">Crea account (prima volta)</button></div>
    <button type="button" class="btn sm" id="lg-reset" style="margin-top:10px;border:0;padding-left:0;color:var(--muted)">Password dimenticata?</button>
  </form>
</div>
<datalist id="dl-titoli"></datalist>
<datalist id="dl-sedi"></datalist>

<script type="module">
import { initializeApp, initializeAuth, getAuth, indexedDBLocalPersistence, browserLocalPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "./firebase.js";
import { firebaseConfig } from "./firebase-config.js";
/* ---------- costanti ---------- */
const AZ_BASE = {
  scilla:   {nome:"Scilla",    full:"Scilla Società Benefit", c:"var(--c-scilla)",    tariffa:25, tariffaPres:25, tariffaFuori:25, fatt:"docenza", gg:null, docs:true, docSenza:null, docRoma:null},
  bioinvent:{nome:"BioInvent", full:"BioInvent SRL",          c:"var(--c-bioinvent)", tariffa:25, tariffaPres:25, tariffaFuori:25, fatt:"mensile", gg:10},
  cmb:      {nome:"CMB",       full:"CMB Consulting",         c:"var(--c-cmb)",       tariffa:30, tariffaPres:40, tariffaFuori:40, fatt:"mensile", gg:30},
  studioeffe:{nome:"Studioeffe", full:"Studioeffe",           c:"var(--c-studioeffe)",tariffa:25, tariffaPres:30, tariffaFuori:35, fatt:"mensile", gg:30, docs:true, docSenza:150, docRoma:250},
  papa:     {nome:"Con papà",  full:"Clienti con papà",       c:"var(--c-papa)",      tariffa:0,  tariffaPres:0,  fatt:"preventivo",gg:null}
};
const AZ_KEYS = ["scilla","bioinvent","cmb","studioeffe","papa"];
const FATT_AZ = ["scilla","bioinvent","cmb","studioeffe"];
const TITOLI_BASE = ["Formazione lavoratori - parte generale","Formazione specifica - rischio basso","Formazione specifica - rischio medio","Formazione specifica - rischio alto","Aggiornamento lavoratori","RLS","Aggiornamento RLS","Preposti","Aggiornamento preposti","Datore di lavoro","RSPP datore di lavoro"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GGS = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const GGL = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const TABS = [
  {id:"calendario", nome:"Calendario", ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'},
  {id:"fatture",    nome:"Fatture",    ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>'},
  {id:"papa",       nome:"Papà",       ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8"/></svg>'},
  {id:"ebafos",     nome:"EBAFOS",     ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>'}
];

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const ym = s => s.slice(0,7);
const addMonths = (m,n) => { const d = parse(m+"-01"); d.setMonth(d.getMonth()+n); return iso(d).slice(0,7); };
const lastDay = m => { const d = parse(m+"-01"); d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const meseNome = m => { const [y,mm] = m.split("-").map(Number); return `${MESI[mm-1]} ${y}`; };
const fmtD = s => s ? `${pad(parse(s).getDate())}/${pad(parse(s).getMonth()+1)}/${parse(s).getFullYear()}` : "";
const fmtDay = s => { const d = parse(s); return `${GGL[(d.getDay()+6)%7]} ${d.getDate()} ${MESI[d.getMonth()]}`; };
const fmtDshort = s => { const d = parse(s); return `${GGS[(d.getDay()+6)%7]} ${d.getDate()}/${pad(d.getMonth()+1)}`; };
const EUR = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const eur = n => EUR.format(n || 0);
const oreF = n => (Math.round((n||0)*100)/100).toLocaleString("it-IT") + " h";
const diffH = (a,b) => { if(!a||!b) return 0; const [h1,m1]=a.split(":").map(Number), [h2,m2]=b.split(":").map(Number); return Math.max(0,(h2*60+m2-h1*60-m1)/60); };
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const pausaAuto = span => span > 5;
const plural = (n, s, p) => `${n} ${n===1?s:p}`;
const pname = x => [x.cognome, x.nome].filter(Boolean).join(" ") || "Senza nome";
const parseDataIt = v => { v = (v||"").trim(); if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); if (!m) return ""; let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; };
const datiMancanti = x => !x.nome || !x.cognome || !x.luogoNascita || !x.dataNascita;
const righe = p => Array.isArray(p.righe) && p.righe.length ? p.righe : (p.corsi ? [] : []);

/* ---------- stato ---------- */
let items = new Map();
let col = null;           // collezione privata nel database
let mode = "loading";     // loading | cloud | local
const ui = {
  tab: "calendario",
  calMonth: today().slice(0,7),
  selDay: today(),
  fattMonth: today().slice(0,7),
  filters: new Set(AZ_KEYS),
  fattShowAll: false,
  ebfShowClosed: false,
  papaShowClosed: false
};
const byKind = k => [...items.values()].filter(x => x.k === k);
const lez = () => byKind("lez");
const fat = () => byKind("fat");
const prev = () => byKind("prev");
const ebf = () => byKind("ebf");
const par = () => byKind("par");
function cfg(){
  const s = items.get("settings");
  const out = {};
  for (const k of AZ_KEYS){
    out[k] = {...AZ_BASE[k], ...((s && s.az && s.az[k]) || {})};
  }
  return out;
}
const docs = () => byKind("doc");
const lezImporto = l => l.k === "doc" ? num(l.compenso) + num(l.rimborso) : l.az === "papa" ? 0 : num(l.ore) * num(l.tariffa) + num(l.rimborso);
const isBill = x => x.k === "doc" ? x.stato === "consegnato" : !x.opz;
const voci = () => [...lez().filter(l => !l.opz), ...docs().filter(d => d.stato === "consegnato")];
const isPres = m => m === "presenza" || m === "fuori";
const modLabel = l => l.mod === "fuori" ? (l.sede || "Fuori Roma") : l.mod === "presenza" ? (l.sede || "In presenza") : "Online";
const tarFor = (a, mod) => mod === "fuori" ? (a.tariffaFuori ?? a.tariffaPres) : mod === "presenza" ? a.tariffaPres : a.tariffa;
const DOC_TIPI = ["DVR","Aggiornamento DVR","Altro documento"];
const SOPR = {no:"Senza sopralluogo", roma:"Sopralluogo a Roma", fuori:"Sopralluogo fuori Roma"};
const docTipo = d => d.tipo === "Altro documento" ? (d.descr || "Documento") : (d.tipo || "DVR");
const docLabel = d => docTipo(d) + (d.cliente ? " · " + d.cliente : "");
const sortLez = (a,b) => (a.data+(a.ini||"")).localeCompare(b.data+(b.ini||""));

/* ---------- salvataggio (funziona anche offline: Firebase tiene una copia locale e sincronizza dopo) ---------- */
let pendingWrites = false;
function newId(prefix){
  if (col) { try { return doc(col).id; } catch(e){} }
  return (prefix||"x") + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function strip(o){ const c = {...o}; delete c.id; return c; }
function writeErr(e){
  toast(e && e.code === "permission-denied" ? "Accesso negato: esci e rientra nell'app." : "Salvataggio non riuscito. Riprova.");
}
function save(id, data){
  id = id || newId(data.k);
  const body = JSON.parse(JSON.stringify(strip(data)));
  items.set(id, {id, ...body}); render();
  if (col) setDoc(doc(col, id), body).catch(writeErr);
  return Promise.resolve(id);
}
function patch(id, part){ const cur = items.get(id); if(!cur) return Promise.resolve(); return save(id, {...cur, ...part}); }
function del(id){
  items.delete(id); render();
  if (col) deleteDoc(doc(col, id)).catch(writeErr);
  return Promise.resolve();
}
async function seq(list, fn){ for (const x of list) await fn(x); }

/* ---------- avvisi ---------- */
function alerts(){
  const t = today(), C = cfg(), out = [];
  for (const az of FATT_AZ.filter(a => C[a].fatt === "mensile")){
    const pend = voci().filter(l => l.az === az && !l.fat && l.data <= t);
    const months = [...new Set(pend.map(l => ym(l.data)))].sort();
    for (const m of months){
      const ls = pend.filter(l => ym(l.data) === m);
      const h = ls.reduce((s,l)=>s+num(l.ore),0), e = ls.reduce((s,l)=>s+lezImporto(l),0);
      const last = lastDay(m);
      if (t > last) out.push({tab:"fatture", lvl:"warn", t:`Emetti la fattura ${C[az].full} di ${meseNome(m)}`, s:`${plural(ls.length,"attività","attività")} · ${oreF(h)} · ${eur(e)}`, mese:m});
      else if (daysBetween(t,last) <= 3) out.push({tab:"fatture", lvl:"info", t:`Fine mese: prepara la fattura ${C[az].full}`, s:`Finora ${oreF(h)} · ${eur(e)} a ${meseNome(m)}`, mese:m});
    }
  }
  for (const az of FATT_AZ.filter(a => C[a].fatt === "docenza")){
    voci().filter(l => l.az === az && !l.fat && l.data <= t).sort(sortLez).forEach(l => {
      out.push({tab:"fatture", lvl:"warn", t:`Emetti la fattura ${C[az].full} per ${l.k==="doc" ? docTipo(l) + " consegnato il" : "la docenza del"} ${fmtD(l.data)}`, s:`${l.k==="doc" ? (l.cliente||"Documento") : (l.titolo||"Docenza") + " · " + oreF(l.ore)} · ${eur(lezImporto(l))}`, mese:ym(l.data)});
    });
  }
  docs().filter(d => d.stato === "consegnato" && !d.fat && !num(d.compenso)).forEach(d => {
    out.push({tab:"fatture", lvl:"warn", t:`Indica il compenso concordato: ${docLabel(d)}`, s:`${(C[d.az]||C.scilla).full} · consegnato il ${fmtD(d.data)}`, mese:ym(d.data)});
  });
  docs().filter(d => d.stato !== "consegnato" && d.data && d.data < t).forEach(d => {
    out.push({tab:"fatture", lvl:"info", t:`Documento oltre la data prevista: ${docLabel(d)}`, s:`${(C[d.az]||C.scilla).full} · previsto il ${fmtD(d.data)} · segnalo come consegnato quando lo invii`});
  });
  fat().filter(f => !f.pagata && f.scad).forEach(f => {
    const d = daysBetween(t, f.scad), n = C[f.az] ? C[f.az].full : "";
    if (d < 0) out.push({tab:"fatture", lvl:"bad", t:`Pagamento in ritardo: fattura ${f.numero?("n. "+f.numero+" "):""}${n}`, s:`${eur(f.importo)} · scaduta il ${fmtD(f.scad)} (${plural(-d,"giorno","giorni")} fa)`});
    else if (d <= 5) out.push({tab:"fatture", lvl:"info", t:`Pagamento atteso: fattura ${f.numero?("n. "+f.numero+" "):""}${n}`, s:`${eur(f.importo)} · entro il ${fmtD(f.scad)}`});
  });
  prev().forEach(p => {
    const st = prevStato(p);
    if (st.key === "dafatturare") out.push({tab:"papa", lvl:"warn", t:`Emetti la fattura a ${p.cliente||"cliente"}`, s:`${num(p.importo)?eur(p.importo)+" · ":""}corsi conclusi`});
    if (st.key === "attestati") out.push({tab:"papa", lvl:"warn", t:`Emetti gli attestati per ${p.cliente||"cliente"}`, s:`Fattura saldata il ${fmtD(p.saldato)}`});
  });
  const ds = par().filter(p => !p.ebf || !items.get(p.ebf));
  if (ds.length) out.push({tab:"ebafos", lvl:"info", t:`${plural(ds.length,"partecipante da smistare","partecipanti da smistare")} nei corsi EBAFOS`, s:"Assegnali a un corso aperto sul portale"});
  ebf().forEach(c => {
    if (c.stato === "aperto" && c.fin && c.fin < t) out.push({tab:"ebafos", lvl:"warn", t:`Chiudi il corso EBAFOS "${c.titolo||"senza titolo"}"`, s:`Terminato il ${fmtD(c.fin)}`});
    if (c.stato === "chiuso"){
      const ps = par().filter(p => p.ebf === c.id && !p.attestato);
      if (ps.length) out.push({tab:"ebafos", lvl:"warn", t:`Attestati da emettere: "${c.titolo||"corso"}"`, s:plural(ps.length,"partecipante","partecipanti") + (ps.some(datiMancanti) ? " · mancano dati anagrafici di qualcuno" : "")});
    }
  });
  lez().filter(l => l.opz && l.data < t).sort(sortLez).forEach(l => {
    out.push({tab:"calendario", lvl:"warn", t:`Data opzionata passata senza conferma: ${l.titolo||"docenza"}`, s:`${fmtD(l.data)} · ${(C[l.az]||C.scilla).full} · confermala o eliminala`});
  });
  const ord = {bad:0, warn:1, info:2};
  return out.sort((a,b) => ord[a.lvl]-ord[b.lvl]);
}
function alertsHtml(list, withTab){
  if (!list.length) return "";
  return `<div class="alerts">${list.map(a => `<a class="alert ${a.lvl}" href="#${a.tab}" ${a.mese?`data-act="gomese" data-m="${a.mese}"`:""}><span><div class="t">${esc(a.t)}</div><div class="s">${esc(a.s||"")}</div></span>${withTab?`<span class="go">${esc(TABS.find(x=>x.id===a.tab).nome)} →</span>`:""}</a>`).join("")}</div>`;
}

/* ---------- render ---------- */
function render(){
  const al = alerts();
  const cnt = id => al.filter(a => a.tab === id && a.lvl !== "info").length;
  $("#nav").innerHTML = TABS.map(t => `<a href="#${t.id}" ${ui.tab===t.id?'aria-current="page"':""}>${t.ico}<span>${t.nome}</span>${cnt(t.id)?`<span class="badge">${cnt(t.id)}</span>`:""}</a>`).join("");
  const sync = $("#sync");
  sync.textContent = mode === "local" ? "Non configurata" : mode === "loading" ? "Caricamento…" : !navigator.onLine ? "Offline · sincronizzo al ritorno della rete" : pendingWrites ? "Sincronizzazione…" : "Sincronizzato";
  let h = "";
  if (mode === "local") h += `<div class="banner">App non ancora collegata al database: manca la configurazione di Firebase. I dati inseriti ora non vengono salvati.</div>`;
  if (mode !== "local" && !navigator.onLine) h += `<div class="banner" style="background:var(--info-bg)">Sei offline: puoi continuare a lavorare, le modifiche si sincronizzano da sole quando torna la connessione.</div>`;
  if (ui.tab === "calendario") h += renderCal(al);
  else if (ui.tab === "fatture") h += renderFatt(al);
  else if (ui.tab === "papa") h += renderPapa(al);
  else h += renderEbf(al);
  $("#main").innerHTML = h;
  $("#fab").style.display = ui.tab === "calendario" || ui.tab === "fatture" ? "" : "none";
  updateDatalists();
}

function updateDatalists(){
  const tit = [...new Set([...lez().map(l => l.titolo).filter(Boolean), ...TITOLI_BASE])];
  $("#dl-titoli").innerHTML = tit.map(t => `<option value="${esc(t)}">`).join("");
  const sedi = [...new Set(["Online","Roma","Passo Corese", ...lez().map(l => l.sede).filter(Boolean)])];
  $("#dl-sedi").innerHTML = sedi.map(t => `<option value="${esc(t)}">`).join("");
}

function lezRow(l, opts={}){
  const C = cfg(), a = C[l.az] || C.scilla;
  const p = l.prev && items.get(l.prev);
  const meta = [l.ini && l.fin ? `${l.ini}–${l.fin}` : "", oreF(l.ore), modLabel(l), l.cliente || (p && p.cliente) || ""].filter(Boolean).join(" · ");
  return `<button class="lrow ${l.opz?"opz":""}" style="--c:${a.c}" data-act="editlez" data-id="${l.id}">
    <span class="bar"></span>
    <span class="b"><span class="tt">${esc(l.titolo || "Docenza")}</span><span class="meta">${opts.date?esc(fmtDshort(l.data))+" · ":""}${esc(meta)}</span></span>
    <span class="r"><div style="font-weight:600">${esc(a.nome)}</div>${l.az!=="papa"?`<div class="muted num">${eur(lezImporto(l))}</div>`:""}${l.fat?`<span class="pill ok">fatturata</span>`:""}${l.opz?`<span class="pill warn">opzionata</span>`:""}</span>
  </button>`;
}

function docRow(d){
  const C = cfg(), a = C[d.az] || C.scilla;
  const sopr = d._ev === "sopr";
  const meta = [sopr ? (d.soprIni || "") : (d.stato === "consegnato" ? "Consegnato" : "Consegna prevista"), SOPR[d.sopr||"no"], d.cliente].filter(Boolean).join(" · ");
  return `<button class="lrow" style="--c:${a.c}" data-act="editdoc" data-id="${d.id}">
    <span class="bar" style="background:repeating-linear-gradient(180deg,var(--c) 0 2px,transparent 2px 4px)"></span>
    <span class="b"><span class="tt">${sopr ? "Sopralluogo · " : ""}${esc(docTipo(d))}</span><span class="meta">${esc(meta)}</span></span>
    <span class="r"><div style="font-weight:600">${esc(a.nome)}</div><div class="muted num">${num(d.compenso)?eur(lezImporto(d)):"da concordare"}</div>${d.fat?`<span class="pill ok">fatturato</span>`:d.stato==="consegnato"?`<span class="pill info">consegnato</span>`:`<span class="pill neutral">in lavorazione</span>`}</span>
  </button>`;
}

function renderCal(al){
  const C = cfg();
  const [y,m] = ui.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const off = (first.getDay()+6)%7;
  const dim = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((off+dim)/7);
  const start = addDays(iso(first), -off);
  const t = today();
  const vis = lez().filter(l => ui.filters.has(l.az));
  const byDay = {};
  vis.forEach(l => (byDay[l.data] = byDay[l.data] || []).push(l));
  docs().filter(d => ui.filters.has(d.az)).forEach(d => {
    if (d.data) (byDay[d.data] = byDay[d.data] || []).push({...d, _ev:"cons"});
    if (d.sopr && d.sopr !== "no" && d.soprData) (byDay[d.soprData] = byDay[d.soprData] || []).push({...d, _ev:"sopr", ini:d.soprIni||""});
  });
  Object.values(byDay).forEach(a => a.sort(sortLez));
  const mesLez = lez().filter(l => !l.opz && ym(l.data) === ui.calMonth);

  let h = "";
  if (al.length){
    const top = al.filter(a => a.lvl !== "info").slice(0,3);
    const rest = al.length - top.length;
    if (top.length) h += `<div class="section">${alertsHtml(top, true)}${rest>0?`<div class="small muted">e altri ${rest} promemoria nelle altre sezioni</div>`:""}</div>`;
  }
  h += `<div class="split"><div>
  <div class="calbar">
    <button class="iconbtn" data-act="calprev" aria-label="Mese precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>${MESI[m-1][0].toUpperCase()+MESI[m-1].slice(1)} ${y}</h2>
    <button class="iconbtn" data-act="calnext" aria-label="Mese successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="btn sm" data-act="caltoday">Oggi</button>
  </div>
  <div class="legend">${AZ_KEYS.map(k => {
    const h2 = mesLez.filter(l => l.az === k).reduce((s,l)=>s+num(l.ore),0);
    return `<button class="chipf" data-act="filter" data-az="${k}" aria-pressed="${ui.filters.has(k)}"><span class="dot" style="background:${C[k].c}"></span>${esc(C[k].nome)} <span class="h num">${oreF(h2)}</span></button>`;
  }).join("")}</div>
  <div class="cal">${GGS.map(g => `<div class="wd">${g}</div>`).join("")}`;
  for (let i=0; i<weeks*7; i++){
    const d = addDays(start, i);
    const evs = byDay[d] || [];
    const cls = ["day", ym(d)!==ui.calMonth?"out":"", d===t?"today":"", d===ui.selDay?"sel":""].join(" ");
    h += `<button class="${cls}" data-act="selday" data-d="${d}" aria-label="${esc(fmtDay(d))}, ${plural(evs.length,"docenza","docenze")}"><span class="n num">${parse(d).getDate()}</span>`;
    evs.slice(0,3).forEach(l => { h += l.k === "doc"
      ? `<span class="ev doc" style="--c:${C[l.az].c}">${esc((l._ev==="sopr" ? "Sopralluogo " : "") + docTipo(l))}</span>`
      : `<span class="ev ${l.opz?"opz":""}" style="--c:${C[l.az].c}">${esc((l.opz?"? ":"")+(l.ini?l.ini+" ":"")+(l.titolo||C[l.az].nome))}</span>`; });
    if (evs.length > 3) h += `<span class="more">+${evs.length-3}</span>`;
    h += `</button>`;
  }
  h += `</div></div>`;

  const dayL = (byDay[ui.selDay] || []);
  const next = vis.filter(l => !l.opz && l.data > ui.selDay).sort(sortLez).slice(0,6);
  h += `<aside class="agenda">
    <div class="section-h"><h3>${esc(fmtDay(ui.selDay))}</h3><div class="spacer"></div><button class="btn sm primary" data-act="newlez" data-d="${ui.selDay}">+ Docenza</button></div>
    ${dayL.length ? dayL.map(l => l.k === "doc" ? docRow(l) : lezRow(l)).join("") : `<div class="empty">Nessuna attività in questa giornata.</div>`}
    ${opzHtml()}
    <h3 style="margin-top:10px">Prossime docenze</h3>
    ${next.length ? next.map(l => lezRow(l,{date:true})).join("") : `<div class="empty">Nessuna docenza in programma dopo questa data.</div>`}
  </aside></div>`;
  return h;
}

function opzHtml(){
  const C = cfg();
  const op = lez().filter(l => l.opz).sort(sortLez);
  if (!op.length) return "";
  const gr = {};
  op.forEach(l => { const k = l.grp || l.id; (gr[k] = gr[k] || []).push(l); });
  return `<h3 style="margin-top:10px">Date opzionate</h3>` + Object.values(gr).map(ls => {
    const a = C[ls[0].az] || C.scilla;
    return `<div class="card" style="border:1px dashed ${a.c};padding:10px 12px">
      <div style="font-weight:600"><span class="dot" style="background:${a.c}"></span> ${esc(ls[0].titolo||"Docenza")}</div>
      <div class="small muted">${esc(a.nome)}${ls[0].cliente?" · "+esc(ls[0].cliente):""} · in attesa di risposta</div>
      ${ls.map(l => `<div class="opzrow"><span class="d num">${esc(fmtDshort(l.data))}${l.ini?" · "+esc(l.ini)+"–"+esc(l.fin||""):""}</span>
        <button class="btn sm primary" data-act="confopz" data-id="${l.id}">Conferma</button><button class="btn sm" data-act="editlez" data-id="${l.id}">Apri</button><button class="btn sm danger" data-act="delopz" data-id="${l.id}" aria-label="Libera questa data">Libera</button></div>`).join("")}
    </div>`;
  }).join("");
}
function confermaOpz(id){
  const l = items.get(id); if (!l) return;
  patch(id, {opz:false});
  const altre = l.grp ? lez().filter(x => x.grp === l.grp && x.id !== id && x.opz) : [];
  if (!altre.length){ toast("Data confermata"); return; }
  openModal(`<h2>Data confermata</h2>
    <p>Hai confermato ${esc(fmtDay(l.data))} per «${esc(l.titolo||"docenza")}». Vuoi liberare le altre date che avevi proposto?</p>
    <div class="small muted" style="margin-bottom:8px">${altre.map(x => esc(fmtDay(x.data))).join("<br>")}</div>
    <div class="mfoot"><div class="spacer"></div><button class="btn" data-close>No, tienile</button><button class="btn primary" id="oz-lib">Sì, libera ${altre.length===1?"la data":"le "+altre.length+" date"}</button></div>`,
  (m, close) => { m.querySelector("#oz-lib").addEventListener("click", () => { altre.forEach(x => del(x.id)); close(); toast("Date liberate"); }); });
}

function renderFatt(al){
  const C = cfg(), M = ui.fattMonth, t = today();
  const mlAll = [...lez().filter(l => !l.opz), ...docs()].filter(x => x.data && ym(x.data) === M);
  const ml = mlAll.filter(isBill);
  const yl = voci().filter(l => l.data.slice(0,4) === M.slice(0,4));
  let h = `<div class="calbar">
    <button class="iconbtn" data-act="fprev" aria-label="Mese precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>${esc(meseNome(M)[0].toUpperCase()+meseNome(M).slice(1))}</h2>
    <button class="iconbtn" data-act="fnext" aria-label="Mese successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>`;
  const totE = ml.reduce((s,l)=>s+lezImporto(l),0), totH = ml.reduce((s,l)=>s+num(l.ore),0);
  h += `<div class="section"><div class="tiles">
    <div class="tile"><div class="l">Totale mese</div><div class="v num">${oreF(totH)}</div><div class="s num">${eur(totE)} da aziende · anno ${oreF(yl.reduce((s,l)=>s+num(l.ore),0))}</div></div>
    ${AZ_KEYS.map(k => { const ls = ml.filter(l=>l.az===k); const hh = ls.reduce((s,l)=>s+num(l.ore),0);
      return `<div class="tile" style="--c:${C[k].c}"><div class="l">${esc(C[k].nome)}</div><div class="v num">${oreF(hh)}</div><div class="s num">${k==="papa"?"fattura per cliente":eur(ls.reduce((s,l)=>s+lezImporto(l),0))} · anno ${oreF(yl.filter(l=>l.az===k).reduce((s,l)=>s+num(l.ore),0))}</div></div>`; }).join("")}
  </div></div>`;
  const fa = al.filter(a => a.tab === "fatture");
  if (fa.length) h += `<div class="section"><div class="section-h"><h2>Da fare</h2></div>${alertsHtml(fa,false)}</div>`;
  const inLav = docs().filter(d => d.stato !== "consegnato").sort(sortLez);
  h += `<div class="section"><div class="section-h"><h2>Documenti in lavorazione</h2><span class="pill neutral">${inLav.length}</span><div class="spacer"></div><button class="btn sm" data-act="newdoc">+ Documento</button></div>
    ${inLav.length ? `<div class="card">${inLav.map(d => { const a = C[d.az] || C.scilla; return `<div class="prow"><span class="dot" style="background:${a.c}"></span><span class="nm" data-act="editdoc" data-id="${d.id}" style="cursor:pointer"><b>${esc(docLabel(d))}</b><div class="small muted">${esc([a.nome, SOPR[d.sopr||"no"], d.soprData?"sopralluogo "+fmtD(d.soprData):"", d.data?"consegna prevista "+fmtD(d.data):"", num(d.compenso)?eur(lezImporto(d)):"compenso da concordare"].filter(Boolean).join(" · "))}</div></span><button class="btn sm primary" data-act="docok" data-id="${d.id}">Segna consegnato</button></div>`; }).join("")}</div>` : `<div class="small muted">Nessun DVR o documento in corso. Quando Studioeffe o Scilla te ne assegnano uno, premi «+ Documento».</div>`}</div>`;

  h += `<div class="section"><div class="section-h"><h2>Attività di ${esc(MESI[parseInt(M.slice(5))-1])}</h2></div>`;
  for (const az of FATT_AZ){
    const a = C[az];
    const ls = mlAll.filter(l => l.az === az).sort(sortLez);
    const bill = ls.filter(isBill);
    const open = bill.filter(l => !l.fat);
    const openDone = open.filter(l => l.data <= t);
    const hh = ls.reduce((s,l)=>s+num(l.ore),0), ee = bill.reduce((s,l)=>s+lezImporto(l),0);
    const regola = a.fatt === "mensile" ? `Fattura mensile${a.gg!=null?` · pagamento a ${a.gg} giorni`:""}` : "Fattura a ogni attività";
    h += `<div class="card azcard" style="--c:${a.c}">
      <div class="azcard-h"><span class="dot" style="background:${a.c}"></span><h3>${esc(a.full)}</h3><span class="pill neutral">${esc(regola)}</span><div class="spacer"></div>
      ${a.docs ? `<button class="btn sm" data-act="newdoc" data-az="${az}">+ Documento</button>` : ""}
      ${bill.length && a.fatt === "mensile" ? `<button class="btn sm" data-act="copia" data-az="${az}">Copia riepilogo</button>` : ""}
      ${a.fatt === "mensile" && open.length ? `<button class="btn sm primary" data-act="newfat" data-az="${az}" data-ids="${open.map(l=>l.id).join(",")}">Registra fattura</button>` : ""}
      </div>`;
    if (!ls.length) h += `<div class="small muted">Nessuna attività a ${esc(meseNome(M))}.</div>`;
    else {
      h += `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Attività</th><th class="r">Ore</th><th class="r">€/h</th><th class="r">Importo</th><th>Stato</th></tr></thead><tbody>`;
      ls.forEach(l => {
        const f = l.fat && items.get(l.fat);
        if (l.k === "doc"){
          const stD = f ? `<span class="pill ${f.pagata?"ok":"info"}">${f.pagata?"saldata":"fatturata"}${f.numero?" n. "+esc(f.numero):""}</span>`
            : l.stato !== "consegnato" ? `<span class="pill neutral">in lavorazione</span>`
            : !num(l.compenso) ? `<span class="pill warn">compenso da definire</span>`
            : a.fatt === "docenza" ? `<button class="btn sm primary" data-act="newfat" data-az="${az}" data-ids="${l.id}">Registra fattura</button>`
            : `<span class="pill warn">da fatturare</span>`;
          h += `<tr class="click" data-act="editdoc" data-id="${l.id}"><td class="num">${esc(fmtDshort(l.data))}</td><td>${esc(docTipo(l))}<div class="small muted">${esc([l.cliente, SOPR[l.sopr||"no"], num(l.rimborso)?"rimborso "+eur(l.rimborso):""].filter(Boolean).join(" · "))}</div></td><td class="r muted">—</td><td class="r muted">—</td><td class="r num">${isBill(l)?eur(lezImporto(l)):`<span class="muted">${num(l.compenso)?eur(lezImporto(l)):"—"}</span>`}</td><td>${stD}</td></tr>`;
          return;
        }
        const st = f ? `<span class="pill ${f.pagata?"ok":"info"}">${f.pagata?"saldata":"fatturata"}${f.numero?" n. "+esc(f.numero):""}</span>`
          : l.data > t ? `<span class="pill neutral">in programma</span>`
          : a.fatt === "docenza" ? `<button class="btn sm primary" data-act="newfat" data-az="${az}" data-ids="${l.id}">Registra fattura</button>`
          : `<span class="pill warn">da fatturare</span>`;
        h += `<tr class="click" data-act="editlez" data-id="${l.id}"><td class="num">${esc(fmtDshort(l.data))}</td><td>${esc(l.titolo||"Docenza")}<div class="small muted">${esc([modLabel(l), l.cliente, num(l.rimborso)?"rimborso "+eur(l.rimborso):""].filter(Boolean).join(" · "))}</div></td><td class="r num">${oreF(l.ore)}</td><td class="r num">${eur(l.tariffa)}</td><td class="r num">${eur(lezImporto(l))}</td><td>${st}</td></tr>`;
      });
      h += `</tbody><tfoot><tr><td colspan="2">Totale</td><td class="r num">${oreF(hh)}</td><td></td><td class="r num">${eur(ee)}</td><td></td></tr></tfoot></table></div>`;
      if (a.fatt === "mensile" && openDone.length && openDone.length < open.length) h += `<div class="small muted" style="margin-top:6px">Alcune attività del mese sono ancora in programma: registra la fattura a fine mese.</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;

  const fs = fat().sort((a,b) => (b.emessa||"").localeCompare(a.emessa||""));
  const shown = ui.fattShowAll ? fs : fs.filter(f => !f.pagata);
  h += `<div class="section"><div class="section-h"><h2>Fatture emesse</h2><div class="spacer"></div>
    <button class="btn sm" data-act="togglefatt">${ui.fattShowAll ? "Mostra solo da incassare" : `Mostra tutte (${fs.length})`}</button></div>`;
  if (!shown.length) h += `<div class="empty">${fs.length ? "Tutte le fatture registrate risultano saldate." : "Nessuna fattura registrata. Quando emetti una fattura, premi «Registra fattura» sull'azienda: qui vedrai scadenza e incasso."}</div>`;
  else {
    h += `<div class="card tbl-wrap"><table><thead><tr><th>Azienda</th><th>N.</th><th>Emessa</th><th class="r">Importo</th><th>Pagamento</th><th></th></tr></thead><tbody>`;
    shown.forEach(f => {
      const a = C[f.az] || C.scilla;
      let st;
      if (f.pagata) st = `<span class="pill ok">saldata il ${fmtD(f.pagata)}</span>`;
      else if (f.scad){ const d = daysBetween(t, f.scad); st = d < 0 ? `<span class="pill bad">scaduta il ${fmtD(f.scad)}</span>` : `<span class="pill ${d<=5?"warn":"neutral"}">attesa entro il ${fmtD(f.scad)}</span>`; }
      else st = `<span class="pill neutral">in attesa</span>`;
      h += `<tr><td><span class="dot" style="background:${a.c}"></span> ${esc(a.nome)}<div class="small muted">${esc(f.mese ? meseNome(f.mese) : "")} · ${plural((f.lez||[]).length,"attività","attività")}</div></td><td>${esc(f.numero||"—")}</td><td class="num">${fmtD(f.emessa)}</td><td class="r num">${eur(f.importo)}</td><td>${st}</td>
        <td class="r"><div class="actions" style="justify-content:flex-end">${f.pagata?"":`<button class="btn sm primary" data-act="paga" data-id="${f.id}">Segna saldata</button>`}<button class="btn sm" data-act="editfat" data-id="${f.id}">Modifica</button></div></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  h += `</div>`;
  return h;
}

function prevStato(p){
  const ps = par().filter(x => x.prev === p.id);
  const attOk = ps.length ? ps.every(x => x.attestato) : !!p.attestatiEmessi;
  if (p.stato !== "concluso") return {key:"incorso", lbl:"Corsi in corso", cls:"info", attOk, ps};
  if (!p.fattData) return {key:"dafatturare", lbl:"Da fatturare", cls:"warn", attOk, ps};
  if (!p.saldato) return {key:"attesa", lbl:"In attesa di saldo", cls:"info", attOk, ps};
  if (p.attestatiMiei && !attOk) return {key:"attestati", lbl:"Attestati da emettere", cls:"warn", attOk, ps};
  return {key:"chiuso", lbl:"Completato", cls:"ok", attOk, ps};
}

function renderPapa(al){
  const pa = al.filter(a => a.tab === "papa");
  let h = `<div class="section"><div class="section-h"><h2>Clienti con papà</h2><div class="spacer"></div><button class="btn primary" data-act="newprev">+ Nuovo cliente</button></div>
  <div class="small muted">Quando papà ti scrive o ti manda una foto con i corsi da fare per un'azienda, crea un cliente: inserisci i corsi e il numero di lavoratori. Ogni cliente segue questi passi: corsi svolti, fattura, saldo, attestati. I partecipanti che aggiungi qui finiscono in EBAFOS, pronti da smistare nei corsi.</div>
  ${alertsHtml(pa,false)}</div>`;
  const all = prev().sort((a,b) => (b.data||"").localeCompare(a.data||""));
  const activi = all.filter(p => prevStato(p).key !== "chiuso");
  const chiusi = all.filter(p => prevStato(p).key === "chiuso");
  const card = p => {
    const st = prevStato(p);
    const lz = lez().filter(l => !l.opz && l.prev === p.id);
    const hh = lz.reduce((s,l)=>s+num(l.ore),0);
    const steps = [
      {l:"Corsi svolti", d:p.stato==="concluso"},
      {l:"Fattura emessa", d:!!p.fattData},
      {l:"Saldato", d:!!p.saldato}
    ];
    if (p.attestatiMiei) steps.push({l:"Attestati", d:st.attOk && !!p.saldato});
    const nowI = steps.findIndex(s => !s.d);
    let act = "";
    if (st.key === "incorso") act = `<button class="btn sm primary" data-act="prevconcluso" data-id="${p.id}">Segna corsi svolti</button>`;
    else if (st.key === "dafatturare") act = `<button class="btn sm primary" data-act="prevfatt" data-id="${p.id}">Registra fattura</button>`;
    else if (st.key === "attesa") act = `<button class="btn sm primary" data-act="prevsaldo" data-id="${p.id}">Segna saldato</button>`;
    else if (st.key === "attestati") act = `<button class="btn sm primary" data-act="prevatt" data-id="${p.id}">Segna attestati emessi</button>`;
    return `<div class="card azcard" style="--c:var(--c-papa)">
      <div class="azcard-h"><h3>${esc(p.cliente||"Cliente")}</h3><span class="pill ${st.cls}">${st.lbl}</span><div class="spacer"></div><span class="num" style="font-weight:700">${num(p.importo)?eur(p.importo):`<span class="small muted">importo da definire</span>`}</span></div>
      ${righe(p).length?`<div class="tbl-wrap"><table><thead><tr><th>Corso</th><th class="r">Lavoratori</th><th class="r">Inseriti</th></tr></thead><tbody>${righe(p).map(r => { const ins = st.ps.filter(x => (x.corsoRich||"") === r.corso).length; return `<tr><td>${esc(r.corso)}</td><td class="r num">${esc(r.n)}</td><td class="r"><span class="pill ${ins>=num(r.n)?"ok":"warn"} num">${ins} / ${esc(r.n)}</span></td></tr>`; }).join("")}</tbody><tfoot><tr><td>Totale</td><td class="r num">${righe(p).reduce((s,r)=>s+num(r.n),0)}</td><td class="r num">${st.ps.length}</td></tr></tfoot></table></div>`:""}
      ${p.corsi?`<div class="small muted" style="white-space:pre-line;margin-top:6px">${esc(p.corsi)}</div>`:""}
      <div class="steps">${steps.map((s,i) => `<span class="step ${s.d?"done":i===nowI?"now":""}">${s.d?"✓ ":""}${s.l}</span>`).join("")}</div>
      <div class="small muted">${[p.data?`Richiesta del ${fmtD(p.data)}`:"", p.fattData?`Fattura${p.fattNum?" n. "+p.fattNum:""} del ${fmtD(p.fattData)}`:"", p.saldato?`saldata il ${fmtD(p.saldato)}`:"", lz.length?`${plural(lz.length,"docenza","docenze")} a calendario · ${oreF(hh)}`:"", p.attestatiMiei?"attestati a mio carico":"attestati non a mio carico"].filter(Boolean).join(" · ")}</div>
      <div class="plist">${st.ps.map(x => { const c = x.ebf && items.get(x.ebf); return `<div class="prow"><span class="nm" data-act="editpar" data-id="${x.id}" style="cursor:pointer">${esc(pname(x))}${x.corsoRich?` <span class="muted small">· ${esc(x.corsoRich)}</span>`:""}</span>${datiMancanti(x)?`<span class="pill bad">dati mancanti</span>`:""}${c?`<span class="pill neutral">${esc(c.titolo||"corso")}</span>`:`<span class="pill warn">da smistare</span>`}${x.attestato?`<span class="pill ok">attestato</span>`:""}</div>`; }).join("")}</div>
      <div class="actions" style="margin-top:10px">${act}<button class="btn sm" data-act="addpar" data-id="${p.id}">+ Partecipanti</button><button class="btn sm" data-act="editprev" data-id="${p.id}">Modifica</button></div>
    </div>`;
  };
  h += `<div class="section">${activi.length ? `<div class="grid2">${activi.map(card).join("")}</div>` : `<div class="empty">Nessun cliente aperto. Premi «+ Nuovo cliente» quando papà ti segnala un'azienda da seguire.</div>`}</div>`;
  if (chiusi.length){
    h += `<div class="section"><div class="section-h"><h2>Completati</h2><span class="pill neutral">${chiusi.length}</span><div class="spacer"></div><button class="btn sm" data-act="togglepapa">${ui.papaShowClosed?"Nascondi":"Mostra"}</button></div>
    ${ui.papaShowClosed?`<div class="grid2">${chiusi.map(card).join("")}</div>`:""}</div>`;
  }
  return h;
}

  const ea = al.filter(a => a.tab === "ebafos");
  const corsi = ebf().sort((a,b) => (a.ini||"").localeCompare(b.ini||""));

      </div></div>`;
  };
  h += `<div class="section"><div class="section-h"><h2>Aperti sul portale</h2><span class="pill neutral">${aperti.length}</span></div>${aperti.length?`<div class="grid2">${aperti.map(ccard).join("")}</div>`:`<div class="empty">Nessun corso aperto. Quando apri un corso sul portale EBAFOS, registralo qui con «+ Corso aperto».</div>`}</div>`;
  if (altri.length) h += `<div class="section"><div class="section-h"><h2>Chiusi</h2><span class="pill neutral">${altri.length}</span><div class="spacer"></div><button class="btn sm" data-act="toggleebf">${ui.ebfShowClosed?"Nascondi":"Mostra"}</button></div>${ui.ebfShowClosed?`<div class="grid2">${altri.map(ccard).join("")}</div>`:""}</div>`;
  return h;
}

/* ---------- scelta corso (menu vero, funziona anche su iPhone) ---------- */
function titoliList(){
  return [...new Set([...TITOLI_BASE, ...lez().map(l => l.titolo), ...ebf().map(c => c.titolo), ...prev().flatMap(p => righe(p).map(r => r.corso)), ...par().map(x => x.corsoRich)].filter(Boolean))];
}
function corsoField(name, value, id, extraClass){
  const list = titoliList(); value = value || "";
  const altro = value && !list.includes(value);
  return `<div class="corso-f"><select class="corso-sel" ${id?`id="${id}"`:""} aria-label="Corso">
    <option value="" ${!value?"selected":""}>— scegli il corso —</option>
    ${list.map(t => `<option value="${esc(t)}" ${t===value?"selected":""}>${esc(t)}</option>`).join("")}
    <option value="__altro" ${altro?"selected":""}>Altro (scrivi a mano)…</option></select>
    <input ${name?`name="${name}"`:""} class="corso-in ${extraClass||""}" value="${esc(value)}" placeholder="Scrivi il nome del corso" aria-label="Nome del corso" ${altro?"":"hidden"}></div>`;
}
document.addEventListener("change", e => {
  const s = e.target;
  if (!s.classList || !s.classList.contains("corso-sel")) return;
  const inp = s.parentElement.querySelector(".corso-in");
  if (s.value === "__altro"){ inp.hidden = false; inp.value = ""; inp.focus(); }
  else { inp.hidden = true; inp.value = s.value; }
});
function sedeChips(inputId){
  const sedi = [...new Set(["Roma","Passo Corese", ...lez().map(l => l.sede), ...ebf().map(c => c.sede)].filter(Boolean))].slice(0,8);
  return `<div class="sede-chips">${sedi.map(x => `<button type="button" class="btn sm" data-sede="${esc(x)}" data-for="${inputId}">${esc(x)}</button>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sede]"); if (!b) return;
  const i = document.getElementById(b.dataset.for); if (i){ i.value = b.dataset.sede; i.dispatchEvent(new Event("input", {bubbles:true})); }
});

/* ---------- modali ---------- */
let modalClose = null;
function openModal(html, mount){
  const root = $("#modal-root");
  root.innerHTML = `<div class="backdrop" id="bd"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bd = $("#bd");
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); modalClose = null; };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bd.addEventListener("click", e => { if (e.target === bd) close(); });
  bd.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  modalClose = close;
  if (mount) mount(bd.querySelector(".modal"), close);
  const f = bd.querySelector("input:not([type=radio]):not([type=checkbox]),textarea,select");
  if (f && window.innerWidth > 700) f.focus();
}
function armDelete(btn, fn){
  btn.addEventListener("click", () => {
    if (btn.classList.contains("armed")) fn();
    else { btn.classList.add("armed"); btn.textContent = "Conferma eliminazione"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Elimina"; }, 4000); }
  });
}
function fd(form){ const o = {}; new FormData(form).forEach((v,k) => o[k] = typeof v === "string" ? v.trim() : v); return o; }
function ask(title, fields, okLabel){
  return new Promise(res => {
    openModal(`<form id="f-ask"><h2>${esc(title)}</h2>${fields.map(f => `<div class="fld"><label for="ask-${f.n}">${esc(f.l)}</label><input id="ask-${f.n}" name="${f.n}" type="${f.t||"text"}" value="${esc(f.v||"")}" ${f.step?`step="${f.step}"`:""} ${f.req?"required":""}></div>`).join("")}
      <div class="mfoot"><div class="spacer"></div><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">${esc(okLabel||"Salva")}</button></div></form>`,
      (m, close) => { m.querySelector("form").addEventListener("submit", e => { e.preventDefault(); const v = fd(e.target); close(); res(v); }); });
  });
}

    <div class="lbl" style="margin-bottom:6px">Per chi</div>
    <div class="seg">${AZ_KEYS.map(k => `<input type="radio" name="az" id="az-${k}" value="${k}" ${l.az===k?"checked":""}><label for="az-${k}" style="--c:${C[k].c}"><span class="dot" style="background:${C[k].c}"></span>${esc(C[k].nome)}</label>`).join("")}</div>
    <div class="row">
      <div class="fld"><label for="l-data">Data</label><input id="l-data" type="date" name="data" value="${esc(l.data)}" required></div>
      <div class="fld"><label for="l-ini">Inizio</label><input id="l-ini" type="time" name="ini" value="${esc(l.ini||"")}"></div>
      <div class="fld"><label for="l-fin">Fine</label><input id="l-fin" type="time" name="fin" value="${esc(l.fin||"")}"></div>
      <div class="fld"><label for="l-ore">Ore conteggiate</label><input id="l-ore" type="number" step="0.25" min="0" name="ore" value="${esc(l.ore)}" inputmode="decimal"></div>
    </div>
    <label class="check" style="margin-bottom:2px"><input type="checkbox" name="pausa" id="l-pausa" ${l.pausa?"checked":""}> Pausa pranzo di 1 ora (non conteggiata né fatturata)</label>
    <div class="hint" style="margin:0 0 10px">Si attiva da sola per le giornate da 6 e 8 ore; i corsi da 4 ore si conteggiano interi.</div>
    <div class="fld"><label for="l-tit">Corso</label>${corsoField("titolo", l.titolo, "l-tit")}</div>
    <div class="lbl" style="margin-bottom:6px">Modalità</div>
    <div class="seg"><input type="radio" name="mod" id="m-on" value="online" ${!isPres(l.mod)?"checked":""}><label for="m-on">Online</label><input type="radio" name="mod" id="m-pr" value="presenza" ${l.mod==="presenza"?"checked":""}><label for="m-pr">In presenza a Roma</label><input type="radio" name="mod" id="m-fu" value="fuori" ${l.mod==="fuori"?"checked":""}><label for="m-fu">In presenza fuori Roma</label></div>
    <div class="fld" id="w-sede"><label for="l-sede">Sede</label><input id="l-sede" name="sede" value="${esc(l.sede||"")}" placeholder="Es. Passo Corese">${sedeChips("l-sede")}</div>

    </div>

    </div></form>`,
  (m, close) => {
    const form = m.querySelector("form");
    let tarManual = !isNew, pausaManual = !isNew, oreManual = !isNew && Math.abs(num(l.ore) - (diffH(l.ini,l.fin) - (l.pausa ? 1 : 0))) > 0.01;
    const g = n => form.elements[n];
    const refresh = () => {
      const az = form.querySelector("[name=az]:checked").value, mod = form.querySelector("[name=mod]:checked").value;
      if (!tarManual) g("tariffa").value = tarFor(C[az], mod);
      const span = diffH(g("ini").value, g("fin").value);
      if (!pausaManual) g("pausa").checked = pausaAuto(span);
      if (!oreManual) g("ore").value = Math.max(0, span - (g("pausa").checked ? 1 : 0));
      m.querySelector("#w-az").style.display = az === "papa" ? "none" : "";
      m.querySelector("#w-papa").style.display = az === "papa" ? "" : "none";
      m.querySelector("#w-sede").style.display = isPres(mod) ? "" : "none";
      m.querySelector("#w-rim").style.display = mod === "fuori" ? "" : "none";
      const opz = form.querySelector("[name=stato]:checked").value === "opz";
      m.querySelector("#w-opzhint").style.display = opz ? "" : "none";
      const wa = m.querySelector("#w-altre"); if (wa) wa.style.display = opz ? "" : "none";
      m.querySelector("#w-imp").textContent = az === "papa" ? "Le docenze con papà si fatturano per cliente nella scheda Papà: qui conto solo le ore." : `Importo: ${eur(num(g("ore").value)*num(g("tariffa").value) + (mod === "fuori" ? num(g("rimborso").value) : 0))}${mod === "fuori" ? " · fuori Roma tariffa e rimborsi si concordano di volta in volta: controlla i valori" : ""}`;
    };
    form.addEventListener("change", e => { if (e.target.name === "az" || e.target.name === "mod") tarManual = false; refresh(); });
    g("tariffa").addEventListener("input", () => { tarManual = true; refresh(); });
    g("ore").addEventListener("input", () => { oreManual = true; refresh(); });
    g("ini").addEventListener("input", () => { oreManual = false; refresh(); });
    g("pausa").addEventListener("change", () => { pausaManual = true; oreManual = false; refresh(); });
    g("fin").addEventListener("input", () => { oreManual = false; refresh(); });
    const td = m.querySelector("#l-todoc");
    if (td) td.addEventListener("click", () => { close(); docModal({data: form.elements.data.value || today()}); });
    const al = m.querySelector("#altre-list");
    if (al){
      const addAltra = () => { const d = document.createElement("div"); d.style.cssText = "display:grid;grid-template-columns:1fr 36px;gap:6px";
        d.innerHTML = `<input type="date" class="altra-d" aria-label="Altra data proposta" style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0"><button type="button" class="iconbtn" aria-label="Togli data">×</button>`;
        d.querySelector("button").addEventListener("click", () => d.remove()); al.appendChild(d); d.querySelector("input").focus(); };
      m.querySelector("#altre-add").addEventListener("click", addAltra);
    }
    refresh();
    const collect = () => {
      const v = fd(form);
      const o = {k:"lez", az:v.az, data:v.data, ini:v.ini, fin:v.fin, ore:num(v.ore), pausa: !!v.pausa, titolo:v.titolo, mod:v.mod, sede:isPres(v.mod)?v.sede:"", rimborso: v.mod==="fuori" && v.az!=="papa" ? num(v.rimborso) : 0, note:v.note, opz: v.stato === "opz", grp: l.grp || null};
      if (v.az === "papa"){ o.tariffa = 0; o.prev = v.prev || null; o.ebf = v.ebf || null; o.cliente = ""; }
      else { o.tariffa = num(v.tariffa); o.cliente = v.cliente; o.prev = null; o.ebf = null; }
      return o;
    };
    form.addEventListener("submit", e => {
      e.preventDefault();
      const o = collect();
      if (!o.data){ toast("Indica la data."); return; }
      o.fat = l.fat || null;
      const altre = (o.opz && al) ? [...al.querySelectorAll(".altra-d")].map(i => i.value).filter(d => d && d !== o.data) : [];
      if (altre.length){
        o.grp = newId("g");
        save(null, o); [...new Set(altre)].forEach(d => save(null, {...o, data:d}));
        close(); ui.selDay = o.data; ui.calMonth = ym(o.data); toast(`${altre.length+1} date opzionate segnate`); return;
      }
      if (!o.opz && l.opz && l.id){ close(); save(l.id, o); confermaOpz(l.id); return; }
      save(l.id, o); ui.selDay = o.data; ui.calMonth = ym(o.data); close(); toast(o.opz ? "Data opzionata segnata" : "Docenza salvata");
    });
    if (!isNew){
      armDelete(m.querySelector("#l-del"), () => {
        if (l.fat){ const f2 = items.get(l.fat); if (f2) patch(f2.id, {lez:(f2.lez||[]).filter(x => x !== l.id)}); }
        del(l.id); close(); toast("Docenza eliminata");
      });
      const cb = m.querySelector("#l-conf"); if (cb) cb.addEventListener("click", () => { const o = collect(); o.fat = l.fat || null; o.opz = false; close(); save(l.id, o); confermaOpz(l.id); });
      m.querySelector("#l-dup").addEventListener("click", () => { const o = collect(); close(); lezModal({...o, data:addDays(o.data,7)}); toast("Copia pronta: scegli la nuova data e salva"); });
    }
  });
}

  openModal(`<form><h2>${existing?"Fattura":"Registra fattura"} · ${esc(a.full)}</h2>

  (m, close) => {
    const sel = m.querySelector("#pk-c"), list = m.querySelector("#pk-list"), nEl = m.querySelector("#pk-n"), go = m.querySelector("#pk-go");
    const count = () => { const n = list.querySelectorAll("input:checked:not(:disabled)").length; nEl.textContent = n ? plural(n,"selezionato","selezionati") : ""; go.disabled = !n; go.textContent = n ? `Iscrivi ${n}` : "Iscrivi"; };
    const draw = () => {
      const ps = par().filter(x => x.prev === sel.value).sort((a,b) => pname(a).localeCompare(pname(b)));
      list.innerHTML = ps.map(x => {
        const cur = x.ebf && items.get(x.ebf);
        const qui = x.ebf === ebfId;
        const match = !cur && (!x.corsoRich || norm(x.corsoRich) === norm(c.titolo));
        return `<label class="prow" style="cursor:pointer"><input type="checkbox" value="${x.id}" ${qui?"checked disabled":match?"checked":""}>
          <span class="nm">${esc(pname(x))}<span class="small muted">${x.corsoRich?" · "+esc(x.corsoRich):""}</span></span>
          ${qui?`<span class="pill ok">già iscritto</span>`:cur?`<span class="pill neutral">in ${esc(cur.titolo||"altro corso")}</span>`:`<span class="pill warn">da iscrivere</span>`}
          ${datiMancanti(x)?`<span class="pill bad">dati mancanti</span>`:""}</label>`;
      }).join("") || `<div class="small muted">Nessun lavoratore per questo cliente.</div>`;
      count();
    };
    sel.addEventListener("change", draw);
    list.addEventListener("change", count);
    m.querySelector("#pk-all").addEventListener("click", () => { list.querySelectorAll("input:not(:disabled)").forEach(i => i.checked = true); count(); });
    m.querySelector("#pk-none").addEventListener("click", () => { list.querySelectorAll("input:not(:disabled)").forEach(i => i.checked = false); count(); });
    draw();
    m.querySelector("form").addEventListener("submit", async e => {
      e.preventDefault();
      const ids = [...list.querySelectorAll("input:checked:not(:disabled)")].map(i => i.value);
      if (!ids.length) return;
      close();
      await seq(ids, id => patch(id, {ebf: ebfId}));
      toast(`${plural(ids.length,"lavoratore iscritto","lavoratori iscritti")} al corso`);
    });
  });
}

/* ---------- lettura da foto o mail ---------- */
let sampleP = null;
function getSample(){ if (!sampleP) sampleP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null); return sampleP; }
function parFromAi(x, extra){ return {k:"par", nome:(x.nome||"").trim(), cognome:(x.cognome||"").trim(), luogoNascita:(x.luogoNascita||"").trim(), dataNascita:parseDataIt(x.dataNascita||""), cf:(x.cf||"").toUpperCase().trim(), corsoRich:"", prev:null, ebf:null, attestato:false, ...extra}; }
async function mountAi(el, kind, apply){
  const sample = await getSample();
  if (!sample || !el.isConnected) return;
  el.innerHTML = `<div class="card" style="background:var(--surface-2);margin-bottom:12px">
    <div style="font-weight:700;margin-bottom:4px">Compila dalla foto o dalla mail di papà</div>
    <div class="hint" style="margin:0 0 8px">Incolla il testo della mail o del messaggio, oppure carica una o più foto. Poi controlla i dati prima di salvare.</div>
    <div class="fld"><label for="ai-t">Testo</label><textarea id="ai-t" style="min-height:70px" placeholder="Es. Per la Edil Rossi servono parte generale e specifica rischio medio per 6 operai e preposti per 2…"></textarea></div>
    <div class="actions"><label class="btn sm" for="ai-f">Carica foto</label><input id="ai-f" type="file" accept="image/*" multiple style="position:absolute;opacity:0;width:1px;height:1px"><span class="small muted" id="ai-fn"></span><div class="spacer" style="flex:1"></div><button type="button" class="btn sm primary" id="ai-go">Leggi e compila</button></div>
    <div class="small" id="ai-msg" style="margin-top:6px"></div></div>`;
  const fi = el.querySelector("#ai-f"), msg = el.querySelector("#ai-msg"), go = el.querySelector("#ai-go");
  fi.addEventListener("change", () => { el.querySelector("#ai-fn").textContent = fi.files.length ? plural(fi.files.length,"foto","foto") + " pronte" : ""; });
  go.addEventListener("click", async () => {
    const txt = el.querySelector("#ai-t").value.trim(), files = [...fi.files];
    if (!txt && !files.length){ msg.textContent = "Incolla un testo o carica una foto."; return; }
    const titoli = [...new Set([...TITOLI_BASE, ...lez().map(l => l.titolo).filter(Boolean)])];
    // nota: "generale" = Formazione lavoratori - parte generale; "specifica medio" = Formazione specifica - rischio medio, ecc.
    const schema = kind === "cliente"
      ? `{"cliente": string (ragione sociale dell'azienda), "corsi": [{"corso": string, "lavoratori": number}], "importo": number|null, "note": string (altre informazioni utili, breve), "partecipanti": [{"nome": string, "cognome": string, "luogoNascita": string, "dataNascita": "GG/MM/AAAA" o "", "cf": string o "", "corso": string o ""}]}`
      : `{"partecipanti": [{"nome": string, "cognome": string, "luogoNascita": string, "dataNascita": "GG/MM/AAAA" o "", "cf": string o ""}]}`;
    const prompt = `Sei l'assistente di una formatrice in sicurezza sul lavoro (D.Lgs. 81/08). Dal materiale qui sotto (messaggio, mail o foto di appunti/elenchi) estrai i dati richiesti.
Per i nomi dei corsi usa sempre, quando corrispondono, esattamente questi nomi standard: ${titoli.join("; ")}. Esempi: "generale" = "Formazione lavoratori - parte generale"; "specifica medio" o "rischio medio" = "Formazione specifica - rischio medio"; "agg. preposti" = "Aggiornamento preposti". Se una persona deve fare parte generale e specifica, crea per i corsi righe separate.
Se una persona deve fare più corsi, mettila una volta sola e indica il corso principale. Non inventare dati: lascia "" o null se mancano.
Rispondi SOLO con JSON valido con questa forma: ${schema}

Materiale:
${txt || "(vedi le foto allegate)"}`;
    go.disabled = true; msg.textContent = "Sto leggendo…";
    try {
      const opts = {modelTier:"default"};
      if (files.length){
        const lim = sample.limits ? await sample.limits() : null;
        if (lim && lim.images) opts.images = files; else { msg.textContent = "In questa vista non posso leggere le foto: incolla il testo."; go.disabled = false; return; }
      }
      const res = await sample.json(prompt, opts);
      msg.textContent = apply(res || {}) || "Fatto.";
    } catch(e){
      msg.textContent = e && e.code === "rate_limited" ? "Troppe richieste ravvicinate: riprova tra un minuto." : "Non sono riuscito a leggere il contenuto. Riprova o compila a mano.";
    } finally { go.disabled = false; }
  });
}

    m.querySelector("form").addEventListener("submit", e => {
